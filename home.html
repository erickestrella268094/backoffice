<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backoffice - Mercancía</title>
    <script>
        if (!localStorage.getItem("token")) {
            window.location.replace("login.html");
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="homeCuerpo">
    
    <header class="homeSuperior">
        <h1>Inventario de Supermercado</h1>
        <a href="login.html" id="btnCerrarSesion" class="btnSalir">Cerrar sesión</a>
    </header>

    <main class="homeContenedor">
        <section class="formularioMercancia">
            <h2 id="tituloFormulario">Agregar Mercancía</h2>
            <form id="formMercancia" class="gridFormulario">
                <input type="text" id="inputNombre" class="estiloinput" placeholder="Nombre del producto" required>
                <input type="text" id="inputDepartamento" class="estiloinput" placeholder="Departamento" required>
                <input type="number" id="inputPrecio" class="estiloinput" placeholder="Precio" step="0.01" min="0" required>
                <input type="url" id="inputImagen" class="estiloinput" placeholder="URL de Imagen">
                
                <div class="accionesFormulario">
                    <button type="button" id="btnCancelarEdicion" class="btnEliminar" style="display: none; max-width: 120px;">Cancelar</button>
                    <button type="submit" id="btnSubmitForm" class="botonestilo btnAgregar">+ Agregar mercancía</button>
                </div>
            </form>
        </section>

        <section class="homeAcciones">
            <h2>Mercancía Registrada</h2>
        </section>

        <section id="panelMercancia" class="proyectos"></section>
    </main>

    <script src="home.js"></script>
</body>
</html>
