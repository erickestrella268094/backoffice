<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>¡Bienvenido!</h1>

    <form id="loginForm">
        <div class="campoinicio">
            <input class="estiloinput" required type="email"
                placeholder="Correo electrónico"
                name="email">

            <input class="estiloinput" required type="password" 
                placeholder="Contraseña"
                name="password">

            <button class="botonestilo" type="submit">Iniciar sesión</button>

            <p>¿No tienes una cuenta? <a href="register.html">Crea una</a></p>
        </div>
    </form>

    <script src="auth.js"></script>
</body>
</html>
